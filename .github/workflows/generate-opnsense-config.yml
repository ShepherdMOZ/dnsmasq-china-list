name: Generate OPNsense Unbound DNS Config

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - 'selected-domains.txt'
      - 'accelerated-domains.china.conf'
      - 'generate_opnsense_unbound.py'
      - '.github/workflows/generate-opnsense-config.yml'
  pull_request:
    paths:
      - 'selected-domains.txt'
      - 'accelerated-domains.china.conf'
      - 'generate_opnsense_unbound.py'
      - '.github/workflows/generate-opnsense-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Sync upstream changes
        run: |
          git remote add upstream https://github.com/felixonmars/dnsmasq-china-list.git || true
          git fetch --depth=1 upstream master
          git checkout upstream/master -- accelerated-domains.china.conf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Unbound Configuration
        run: |
          if [ ! -f selected-domains.txt ]; then
            echo "selected-domains.txt not found. Please create this file in the repository root containing your allow list of domains."
            exit 0
          fi
          python3 generate_opnsense_unbound.py

      - name: Upload Artifact
        if: hashFiles('selected-domains.unbound.conf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: selected-domains-unbound-config
          path: selected-domains.unbound.conf

      - name: Commit and Push Changes
        if: github.event_name != 'pull_request'
        run: |
          git add selected-domains.unbound.conf accelerated-domains.china.conf
          if ! git diff --cached --quiet; then
            git commit -m "auto: update configurations [skip ci]"
          else
            echo "No changes to commit"
          fi
          git push
